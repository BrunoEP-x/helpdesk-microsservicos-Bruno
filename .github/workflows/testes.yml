name: Testes e segurança
on: [push, pull_request]

# O workflow só pode ler o código (privilégio mínimo)
permissions:
  contents: read

jobs:
  testes:
    name: Testes · ${{ matrix.projeto }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        projeto: [comum, servicos/usuarios, servicos/inventario, servicos/chamados, servicos/notificacoes, servicos/assistente, servicos/gateway]
    defaults:
      run:
        working-directory: ${{ matrix.projeto }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Redis (usado no teste do consumidor de eventos)
        if: matrix.projeto == 'servicos/notificacoes'
        run: sudo apt-get update -q && sudo apt-get install -y -q redis-server
      - run: pip install -r requirements.txt pytest==9.2.0 httpx==0.28.1 pip-audit==2.10.1
      - name: Testes (inclui testes de segurança)
        run: pytest -q
      - name: Dependências com falhas conhecidas
        run: pip-audit -r requirements.txt

  compose:
    name: docker compose sobe e o teste ponta a ponta passa
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: docker compose up --build -d
      - name: Aguarda todos os serviços ficarem saudáveis
        run: |
          for i in $(seq 1 60); do
            curl -sf http://localhost:8000/saude | grep -q '"status":"ok"' && exit 0
            sleep 3
          done
          exit 1
      - run: python3 scripts/teste_ponta_a_ponta.py http://localhost:8000
      - if: failure()
        run: docker compose logs --no-color
