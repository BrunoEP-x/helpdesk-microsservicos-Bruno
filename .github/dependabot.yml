version: 2
# Atualizações agrupadas: um PR por ecossistema por semana, em vez de um por pacote e serviço
updates:
  - package-ecosystem: pip
    directories: ["/", "/comum", "/servicos/*"]
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      dependencias-python:
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: docker
    directories: ["/servicos/*"]
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
    groups:
      imagens-docker:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
    groups:
      actions:
        patterns: ["*"]
